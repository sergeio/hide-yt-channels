<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hide YouTube Channels — Manage Hidden</title>
    <style>
      body {
        font-family: Roboto, Arial, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #0f0f0f;
      }
      h1 {
        font-size: 1.3rem;
      }
      h2 {
        font-size: 1.05rem;
        margin-bottom: 0.4rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0 0 1.5rem;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid #e5e5e5;
        font-size: 0.9rem;
        word-break: break-all;
      }
      li code {
        font-size: 0.85em;
      }
      button {
        flex-shrink: 0;
      }
      .empty {
        color: #606060;
        font-size: 0.85rem;
        padding: 0.4rem 0.6rem;
      }
    </style>
  </head>
  <body>
    <h1>Hidden channels and videos</h1>
    <h2>Channels</h2>
    <ul id="channel-list"></ul>
    <h2>Videos</h2>
    <ul id="video-list"></ul>
    <script src="options.js"></script>
  </body>
</html>
